name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate"
            exit 1
          fi
      # A version already on crates.io is a green no-op: re-running a release
      # must not fail because the registry got there first.
      - name: Already published?
        id: published
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          # crates.io rejects requests without a User-Agent (403), which would
          # otherwise look like "unknown state" and block every release.
          status=$(curl -s -A "inwx-client-release-workflow (github.com/floffel/inwx-client)" \
            -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/inwx-client/$version")
          echo "crates.io answered $status for $version"
          case "$status" in
            200) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected crates.io answer $status"; exit 1 ;;
          esac
      # The token must exist before the first irreversible step.
      - name: Registry token present
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
      - name: Publish (dry run)
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
