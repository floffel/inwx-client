[package]
name = "inwx-client"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Typed client for the INWX DomRobot JSON-RPC API: zones, DNS records, transfers, certificates, hosting, DNSSEC and accounting"
repository = "https://github.com/floffel/inwx-client"
documentation = "https://docs.rs/inwx-client"
keywords = ["inwx", "domrobot", "dns", "domain", "api-client"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"
exclude = [".github/**", "deny.toml", "fuzz/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["http"]
# `bytes` is only the chunk type of the reqwest adapter; it is already in the
# tree through reqwest, so this names it instead of copying every chunk.
http = ["dep:bytes", "dep:rand", "dep:reqwest", "dep:tokio"]

[dependencies]
base64 = "0.22"
bon = "3.10.3"
bytes = { version = "1", optional = true }
# ISO 3166-1 lives in a maintained table, not in a two-ASCII-letters check:
# `ZZ` and `QQ` are two letters and still not countries.
celes = { version = "3", default-features = false }
# The DS digest is hex and its length is fixed by the digest type; `data-encoding`
# decodes it (both cases, with a typed error) instead of a local hex loop that
# would report "not hex" for a digest that is hex of the wrong length.
data-encoding = "2.11"
# RFC 5321 address shape (local part, domain, length caps) from the maintained
# validator; the local part is not re-implemented as a `split_once('@')`.
garde = { version = "0.23", default-features = false, features = ["email"] }
# `Retry-After` may be a delay in seconds or an HTTP-date; both forms are
# parsed by the maintained `httpdate`, never by hand.
httpdate = "1"
# HTTP header and response containers are maintained by the `http` crate; the
# reqwest transport already pulls it into the tree, so naming it directly keeps
# the shared types instead of a second hand-rolled header model.
http = "1"
# UTS-46 ToASCII with STD3 rules, the hyphen rule and `VerifyDNSLength`: name
# validation belongs in a maintained IDNA implementation, not in this crate.
idna = "1"
# The backoff jitter is one uniform float per retry; `rand` draws it from the
# thread-local generator. A hand-rolled xorshift seeded from the clock would
# hand every process started in the same nanosecond the same sequence, which is
# exactly the lockstep the jitter exists to break.
rand = { version = "0.10", default-features = false, features = ["thread_rng"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
# ISO-8601 parsing for the `timestamp` parameters (scheduled execution dates,
# accounting ranges). A maintained parser beats a hand-rolled shape check.
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "macros", "std"] }
# Wipes a `Password` from memory when it is dropped, so a new secret does not
# linger in heap allocations until the allocator recycles them.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
tokio = { version = "1", default-features = false, features = ["time"], optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
