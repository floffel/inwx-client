[package]
name = "inwx-client-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.inwx-client]
path = ".."
default-features = false

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_price_rows"
path = "fuzz_targets/parse_price_rows.rs"
test = false
doc = false
bench = false

# The hand-rolled value parsers (Period, RenewalMode, ContactType, PriceType).
# Their curated seeds live in fuzz/corpus/parse_types and are replayed with
# their exact expected outcome by tests/fuzz_fixtures.rs.
[[bin]]
name = "parse_types"
path = "fuzz_targets/parse_types.rs"
test = false
doc = false
bench = false

# The DNS name parsers: nothing may panic, and every accepted name must already
# be canonical and survive a second pass unchanged.
[[bin]]
name = "parse_name"
path = "fuzz_targets/parse_name.rs"
test = false
doc = false
bench = false

# The `Retry-After` header: never panics, and a digits-only value is exactly
# that many seconds. Its curated seeds live in fuzz/corpus/parse_retry_after.
[[bin]]
name = "parse_retry_after"
path = "fuzz_targets/parse_retry_after.rs"
test = false
doc = false
bench = false

[workspace]
