[package]
name = "inwx-client-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.inwx-client]
path = ".."
default-features = false

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_names"
path = "fuzz_targets/parse_names.rs"
test = false
doc = false
bench = false

[workspace]
